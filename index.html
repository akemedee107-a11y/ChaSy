<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ChaSy — simple local chat workshop">
  <title>ChaSy — Simple Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="ChaSy home">
        <span class="brand-mark">C</span>
        <span>ChaSy</span>
      </a>

      <div class="workspace">
        <span class="workspace-avatar">W</span>
        <div>
          <strong>Workshop Team</strong>
          <small>พื้นที่สนทนาของเรา</small>
        </div>
      </div>

      <nav aria-label="ห้องสนทนา">
        <p class="nav-label">ห้องสนทนา</p>
        <button class="channel active" type="button">
          <span>#</span> general
        </button>
      </nav>

      <section class="people" aria-labelledby="people-title">
        <p class="nav-label" id="people-title">สมาชิก — <span id="peopleCount">0</span></p>
        <div id="peopleList"></div>
      </section>

      <p class="storage-note">ข้อความถูกเก็บไว้ในอุปกรณ์นี้</p>
    </aside>

    <section class="chat-panel">
      <header class="chat-header">
        <div>
          <h1><span>#</span> general</h1>
          <p>คุยเรื่องทั่วไปกับทุกคนในทีม</p>
        </div>
        <button class="icon-button" id="clearButton" type="button" title="ล้างข้อความ" aria-label="ล้างข้อความ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-9 0 1 15h8l1-15M10 10v7m4-7v7"/></svg>
        </button>
      </header>

      <div class="messages" id="messageList" aria-live="polite"></div>

      <form class="composer" id="messageForm">
        <label class="sender-label" for="senderInput">ชื่อผู้ส่ง</label>
        <input id="senderInput" maxlength="30" autocomplete="name" placeholder="กรอกชื่อของคุณ" aria-label="ชื่อผู้ส่ง" required>
        <div class="message-input-wrap">
          <input id="messageInput" maxlength="300" autocomplete="off" placeholder="ส่งข้อความถึง #general" aria-label="ข้อความ">
          <button class="send-button" type="submit" aria-label="ส่งข้อความ">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3-8-3-8Zm3 8h13"/></svg>
            <span>ส่ง</span>
          </button>
        </div>
        <p class="form-message" id="formMessage" role="status"></p>
      </form>
    </section>
  </main>

  <template id="emptyStateTemplate">
    <div class="empty-state">
      <div class="empty-icon">👋</div>
      <h2>เริ่มต้นห้อง #general</h2>
      <p>เลือกชื่อ พิมพ์ข้อความ แล้วเริ่มคุยกันได้เลย</p>
    </div>
  </template>

  <script src="app.js?v=3"></script>
</body>
</html>
